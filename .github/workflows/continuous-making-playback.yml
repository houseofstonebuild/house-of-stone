name: Continuous making playback benchmark
on:
  push:
    branches: ['rebuild/continuous-making-2026-11-17']
    paths: ['server.mjs', 'public/prototypes/continuous-sequence.js', 'public/prototypes/continuous-decode-worker.js', 'qa/continuous-sequence.mjs', 'tools/continuous-making/pack.py', '.github/workflows/continuous-making-playback.yml']
permissions:
  contents: read
concurrency:
  group: continuous-playback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix qa --no-audit --no-fund
      - run: npm run check && npm test
      - name: Measure actual painted motion and reversals
        run: sh scripts/run-browser-qa.sh qa/continuous-sequence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-playback-review
          path: test-results/browser/continuous-making/
          retention-days: 14
