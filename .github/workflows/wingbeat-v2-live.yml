name: Verify revised Wingbeat in production
on:
  pull_request:
    branches: [main]
    paths: ['qa/wingbeat-v2-live.mjs', '.github/workflows/wingbeat-v2-live.yml']
permissions:
  contents: read
jobs:
  live:
    if: github.head_ref == 'verify/wingbeat-v2-production'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --prefix qa --no-package-lock
      - run: node qa/wingbeat-v2-live.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wingbeat-v2-production-verification
          path: test-results/wingbeat-v2-live/
