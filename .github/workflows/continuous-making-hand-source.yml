name: Inspect licensed hand rig source
on:
  push:
    branches: ['rebuild/continuous-making-2026-11-17']
    paths: ['.github/workflows/continuous-making-hand-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p hand-source
          for side in left right; do
            curl --fail --location --silent --show-error "https://raw.githubusercontent.com/immersive-web/webxr-input-profiles/main/packages/assets/profiles/generic-hand/$side.glb" --output "hand-source/$side.glb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-making-hand-source
          path: hand-source/
          retention-days: 7
