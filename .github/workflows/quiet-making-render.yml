name: Quiet stone transformation render and acceptance
on:
  push:
    branches: ['refine/quiet-stone-journey-2026-11-17']
    paths:
      - 'tools/continuous-making/render.py'
      - '.github/workflows/quiet-making-render.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quiet-making-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
        start: [0, 80, 160, 240, 320, 400]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline source preparation and matte dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @gltf-transform/core @gltf-transform/extensions meshoptimizer
          python -m pip install numpy scipy scikit-image trimesh vtk pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libxrender1 libxext6 libxkbcommon0 libsm6 libice6 libgl1-mesa-dri libglx-mesa0
      - uses: actions/cache@v4
        id: blender
        with:
          path: /tmp/blender-4.3.2-linux-x64
          key: mabwe-offline-blender-4.3.2
      - name: Install source-pinned renderer
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          if ! curl --fail --retry 2 --retry-all-errors --retry-delay 5 --location --silent --show-error https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz --output /tmp/blender.tar.xz; then
            curl --fail --retry 3 --retry-all-errors --retry-delay 5 --location --silent --show-error https://mirror.clarkson.edu/blender/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz --output /tmp/blender.tar.xz
          fi
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Prepare original approved model and exact changing solid states
        run: |
          node tools/carving-pilot/decode-coil.mjs public/models/coil-uploaded-v1.glb build/continuous-making/coil.obj
          node tools/continuous-making/decode.mjs
          python tools/continuous-making/prepare.py --start ${{ matrix.start }} --end $(( ${{ matrix.start }} + 80 ))
      - name: Render high resolution stone with no hands or tools
        run: |
          xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python tools/continuous-making/render.py -- --root build/continuous-making --profile ${{ matrix.profile }} --full --quiet
          xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python tools/continuous-making/passes.py -- --root build/continuous-making --profile ${{ matrix.profile }} --full --quiet --matte
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Capture empty-lighting plate for real contact shadows
        if: matrix.start == 0
        run: xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python tools/continuous-making/passes.py -- --root build/continuous-making --profile ${{ matrix.profile }} --full --quiet --plate
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-stone-${{ matrix.profile }}-${{ matrix.start }}
          path: |
            build/continuous-making/review/
            build/continuous-making/mattes/
            build/continuous-making/plates/
          compression-level: 0
          retention-days: 7
  composite:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: quiet-stone-*
          merge-multiple: true
          path: build/continuous-making/
      - run: python -m pip install pillow numpy
      - name: Composite matching tool-free beauty and object mattes
        run: python tools/continuous-making/composite.py
      - name: Pack the exact approved final Coil finish and full quality stone frames
        run: python tools/continuous-making/pack.py --form --flat
      - name: Prepare extended original documentary frames for acceptance
        run: python tools/continuous-making/pack.py --documentary
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-stone-verified-media
          path: public/assets/continuous-making-v1/
          compression-level: 0
          retention-days: 14
  acceptance:
    needs: composite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: quiet-stone-verified-media
          path: public/assets/continuous-making-v1/
      - run: npm install --prefix qa --no-audit --no-fund
      - run: npm run check && npm test
      - name: Verify source integrity, six stages, finished Coil, scroll reversal and mobile frame cadence
        run: sh scripts/run-browser-qa.sh qa/continuous-making-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-stone-responsive-acceptance
          path: test-results/browser/continuous-making-full/
          retention-days: 14
      - name: Retain verified frames only after acceptance passes
        if: success()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name houseofstonebuild
          git config user.email houseofstonebuild@users.noreply.github.com
          git add public/assets/continuous-making-v1/form public/assets/continuous-making-v1/material public/assets/continuous-making-v1/workshop
          git diff --cached --quiet && exit 0
          git commit -m 'Retain tool-free Coil transformation and longer original documentary'
          git fetch origin refine/quiet-stone-journey-2026-11-17
          git rebase origin/refine/quiet-stone-journey-2026-11-17
          git push origin HEAD:refine/quiet-stone-journey-2026-11-17
