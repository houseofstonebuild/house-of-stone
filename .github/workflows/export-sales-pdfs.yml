name: Export House of Mabwe sales PDFs
on:
  push:
    paths:
      - 'scripts/export-sales-pdfs.py'
      - '.github/workflows/export-sales-pdfs.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab pillow pypdf
      - run: python scripts/export-sales-pdfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: House-of-Mabwe-Sales-Materials
          path: sales-output/
          retention-days: 30
