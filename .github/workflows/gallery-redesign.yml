name: Gallery redesign
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --prefix qa --no-package-lock
      - run: node qa/closer-look.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sculpture-closeups
          path: test-results/closeups/
      - run: node qa/compact-layout.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compact-layout
          path: test-results/compact/
      - run: node qa/collection-experience.mjs
      - run: node qa/gallery-redesign.mjs
      - run: node qa/light-theme.mjs
      - run: node qa/related-cards.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gallery-redesign
          path: test-results/

