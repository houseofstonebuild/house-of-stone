name: Verify Making v6 deployed private preview
on:
  push:
    branches: [main]
    paths:
      - 'public/prototypes/stone-to-sculpture.html'
      - 'public/prototypes/stone-to-sculpture.css'
      - 'public/prototypes/stone-to-sculpture-v6.js'
      - 'qa/check-making-v6-live.mjs'
      - '.github/workflows/making-v6-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact live HTML, JS, CSS and mobile/desktop asset hashes
        run: node qa/check-making-v6-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: making-v6-exact-live-check
          path: test-results/live-making-v6/verification.json
          retention-days: 7
          if-no-files-found: warn
