name: Review Wingbeat shape correction
on:
  pull_request:
    branches: [main]
    paths: ['scripts/correct-wingbeat.mjs', 'scripts/wingbeat-shape-fit.json', 'qa/wingbeat-shape.mjs', '.github/workflows/wingbeat-shape.yml']
permissions:
  contents: write
jobs:
  shape:
    if: github.head_ref == 'refine/wingbeat-shape'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Build corrected mesh while preserving the original
        run: |
          node scripts/correct-wingbeat.mjs public/models/wingbeat-v1.glb scripts/wingbeat-shape-fit.json public/models/wingbeat-v2.glb
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('public/models.json'));
          manifest['zsa-016'].file='/models/wingbeat-v2.glb';
          manifest['zsa-016'].geometryVersion=2;
          writeFileSync('public/models.json',JSON.stringify(manifest,null,2)+'\n');
          JS
      - run: npm run check
      - run: npm test
      - run: npm install --prefix qa --no-package-lock
      - name: Render original and corrected model at matched angles
        run: node qa/wingbeat-shape.mjs
      - name: Store the checked model on the review branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/wingbeat-v2.glb public/models.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store checked Wingbeat shape refinement'
            git push origin HEAD:refine/wingbeat-shape
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wingbeat-shape-review
          path: test-results/interiors/
