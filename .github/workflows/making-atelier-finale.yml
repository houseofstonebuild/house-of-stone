name: Render exact Coil for the new Making finale
on:
  push:
    branches: [main]
    paths:
      - 'qa/capture-atelier-coil.mjs'
      - '.github/workflows/making-atelier-finale.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: making-atelier-finale-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix qa --no-audit --no-fund
      - name: Render unchanged approved Coil model without the generic plinth
        run: sh scripts/run-browser-qa.sh qa/capture-atelier-coil.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: making-atelier-approved-coil-no-plinth
          path: public/assets/making-atelier-final-mobile-v1.png
          retention-days: 14
  publish:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: making-atelier-approved-coil-no-plinth
          path: public/assets/
      - name: Publish source-true mobile final render
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/making-atelier-final-mobile-v1.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish plinth-free original Coil render for new Making study'
          git pull --rebase origin main
          git push origin HEAD:main
