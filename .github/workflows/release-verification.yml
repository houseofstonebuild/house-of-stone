name: Release verification
on:
  push:
    branches: [release/verify-founding-collections]
    paths: [.github/workflows/release-verification.yml]
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c56885dad503b60617ae9eab356d22ccc0ee98ce
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --prefix qa --no-audit --no-fund
      - name: Wait for the tested refinement release
        uses: actions/github-script@v8
        with:
          script: |
            const expected='c56885dad503b60617ae9eab356d22ccc0ee98ce';
            const required=['Website checks','Browser QA'];
            const deadline=Date.now()+30*60*1000;
            while(Date.now()<deadline){
              const response=await github.rest.actions.listWorkflowRunsForRepo({...context.repo,branch:'enhancement/collection-presentation',event:'pull_request',per_page:30});
              const runs=response.data.workflow_runs.filter(run=>run.head_sha===expected && required.includes(run.name));
              for(const run of runs)if(run.status==='completed' && run.conclusion!=='success')throw new Error(run.name+' failed for the main release: '+run.conclusion);
              const main=await github.rest.repos.getBranch({...context.repo,branch:'main'});
              if(main.data.commit.sha===expected && required.every(name=>runs.some(run=>run.name===name && run.conclusion==='success'))){core.info('Tested refinement release is on main: '+expected);return;}
              core.info('Waiting for main: '+runs.map(run=>run.name+' '+run.status).join(', '));
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            throw new Error('Tested refinement release was not on main within 30 minutes');
      - name: Verify the deployed release without writes
        run: node qa/live.mjs
      - run: node qa/light-theme.mjs
        env:
          HOS_LIGHT_PREVIEW_URL: https://house-of-stone-production.up.railway.app
      - name: Confirm the editor is protected and report published content
        run: |
          node --input-type=module <<'JS'
          const base='https://house-of-stone-production.up.railway.app';
          const editor=await fetch(base+'/admin/content');
          if(editor.status!==401 || !editor.headers.get('www-authenticate'))throw Error('Editor authentication check failed');
          const response=await fetch(base+'/content.json');const content=await response.json();
          console.log('PUBLISHED_CATALOGUE '+JSON.stringify({works:content.works.length,collections:(content.collections || []).map(c=>c.name),editorStatus:editor.status,editorURL:editor.url}));
          JS
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-collection-release
          path: |
            test-results/live/
            test-results/browser/light-*
          retention-days: 7
