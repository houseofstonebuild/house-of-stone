name: Mabwe introduction rebuild review
on:
  push:
    branches: ['refine/mabwe-film-2026-11-17']
  pull_request:
    paths:
      - 'public/prototypes/making-atelier.*'
      - 'public/prototypes/coil-formation.js'
      - 'public/prototypes/story-film-atlas.js'
      - 'qa/welcome-scroll-acceptance.mjs'
permissions:
  contents: write
concurrency:
  group: mabwe-film-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix qa --no-audit --no-fund
      - name: Capture the unchanged approved final sculpture
        run: sh scripts/run-browser-qa.sh qa/capture-story-finish.mjs
      - run: npm run check && npm test
      - name: Review source footage for editorial selection
        run: sh scripts/run-browser-qa.sh qa/review-story-source.mjs
      - name: Pacing and responsive review
        run: sh scripts/run-browser-qa.sh qa/welcome-scroll-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mabwe-quiet-film-review
          path: test-results/browser/welcome-film/
          retention-days: 14
      - name: Retain the validated final stills on the review branch
        if: github.ref == 'refs/heads/refine/mabwe-film-2026-11-17' && success()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name houseofstonebuild
          git config user.email 'houseofstonebuild@users.noreply.github.com'
          git add public/assets/story-sequence-v1/approved
          git diff --cached --quiet && exit 0
          git commit -m 'Retain registered final stills from unchanged approved Coil renderer'
          git push origin HEAD:refine/mabwe-film-2026-11-17
