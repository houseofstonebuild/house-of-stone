name: Extend the original documentary chapters
# End the workshop passage before the edit to the recognisable lion.
on:
  push:
    branches: ['rebuild/continuous-making-2026-11-17']
    paths: ['.github/workflows/continuous-making-documentary.yml']
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install pillow
      - run: python tools/continuous-making/extend_documentary.py
      - uses: actions/upload-artifact@v4
        with:
          name: extended-documentary-contact
          path: build/continuous-making/documentary/*-contact.jpg
      - name: Retain extended original footage
        run: |
          git config user.name houseofstonebuild
          git config user.email houseofstonebuild@users.noreply.github.com
          git add public/assets/continuous-making-v1/artist public/assets/continuous-making-v1/workshop
          git commit -m 'Extend the two documentary chapters using original source footage'
          git fetch origin rebuild/continuous-making-2026-11-17
          git rebase origin/rebuild/continuous-making-2026-11-17
          git push origin HEAD:rebuild/continuous-making-2026-11-17
