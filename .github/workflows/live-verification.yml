name: Live website verification
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --prefix qa --no-audit --no-fund
      - run: npx --prefix qa playwright install --with-deps chromium
      - run: node qa/live.mjs
        env:
          HOS_EXPECT_FOUNDING_RELEASE: 'true'
          HOS_LIVE_URL: https://houseofmabwe.com
      - run: node qa/light-theme.mjs
        env:
          HOS_LIGHT_PREVIEW_URL: https://houseofmabwe.com
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-website-verification
          path: |
            test-results/live/
            test-results/browser/light-*
          retention-days: 7
