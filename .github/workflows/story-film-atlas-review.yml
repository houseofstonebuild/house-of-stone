name: Isolated progressive documentary atlases
on:
  push:
    branches: ['review/our-story-scroll-qa-2026-11-16']
    paths:
      - 'scripts/build-story-film-atlases.py'
      - '.github/workflows/story-film-atlas-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: story-atlases-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Build and verify original documentary tile sheets
        run: |
          python scripts/build-story-film-atlases.py
          python - <<'PY'
          import json,os,hashlib
          from PIL import Image
          p='public/assets/making-film-atlas-v1'
          m=json.load(open(p+'/manifest.json'))
          assert m['frames']==200 and m['frames_per_sheet']==25
          for profile in ['desktop','mobile']:
            sizes=m['profiles'][profile]
            for index in range(8):
              path=f'{p}/{profile}/sheet_{index:02d}.webp'
              with Image.open(path) as img:
                assert img.size==(sizes['tile_width']*5,sizes['tile_height']*5)
              assert os.path.getsize(path)>10000
          print('All responsive film scrubbing sheets validated')
          PY
      - name: Publish only the isolated review atlases
        if: ${{ success() && github.ref == 'refs/heads/review/our-story-scroll-qa-2026-11-16' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/making-film-atlas-v1/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish responsive documentary motion atlases for isolated scroll review'
          for i in 1 2 3 4 5 6; do
            git fetch origin review/our-story-scroll-qa-2026-11-16
            git rebase origin/review/our-story-scroll-qa-2026-11-16
            if git push origin HEAD:review/our-story-scroll-qa-2026-11-16; then exit 0; fi
          done
          exit 1
