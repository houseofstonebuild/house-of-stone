name: Verify deployed new Making study
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check real origin and exact approved-model assets
        run: node qa/check-making-atelier-live.mjs
