name: Correct and review the final making study
on:
  push:
    branches: ['rebuild/continuous-making-2026-11-17']
    paths: ['.github/workflows/continuous-making-grips.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: continuous-making-grips-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
        range: [{start: 40, end: 120}, {start: 120, end: 200}, {start: 200, end: 248}, {start: 328, end: 400}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline source preparation tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @gltf-transform/core @gltf-transform/extensions meshoptimizer
          python -m pip install numpy scipy scikit-image trimesh vtk pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libxrender1 libxext6 libxkbcommon0 libsm6 libice6 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - uses: actions/cache@v4
        id: blender
        with:
          path: /tmp/blender-4.3.2-linux-x64
          key: mabwe-offline-blender-4.3.2
      - name: Install full CPU renderer
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          if ! curl --fail --retry 2 --retry-all-errors --retry-delay 5 --location --silent --show-error https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz --output /tmp/blender.tar.xz; then
            curl --fail --retry 3 --retry-all-errors --retry-delay 5 --location --silent --show-error https://mirror.clarkson.edu/blender/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz --output /tmp/blender.tar.xz
          fi
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Prepare source-derived solid states
        run: |
          node tools/carving-pilot/decode-coil.mjs public/models/coil-uploaded-v1.glb build/continuous-making/coil.obj
          node tools/continuous-making/decode.mjs
          python tools/continuous-making/prepare.py --start ${{ matrix.range.start }} --end ${{ matrix.range.end }}
      - name: Render the corrected gripping region
        run: |
          xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python tools/continuous-making/grip_patch.py -- --root build/continuous-making --profile ${{ matrix.profile }} --full
          xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python tools/continuous-making/grip_patch.py -- --root build/continuous-making --profile ${{ matrix.profile }} --full --matte
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-grip-${{ matrix.profile }}-${{ matrix.range.start }}
          path: build/continuous-making/grip-patches/
          compression-level: 0
          retention-days: 7
  pack:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for the original render pieces
        env:
          MAKING_ACTION_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWAIT'
          import os,time,json,urllib.request
          for attempt in range(120):
            ready=True
            for run_id in [44051932446,44052780448]:
              request=urllib.request.Request(f'https://api.github.com/repos/houseofstonebuild/house-of-stone/actions/runs/{run_id}/jobs?per_page=100',headers={'Authorization':'Bearer '+os.environ['MAKING_ACTION_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:jobs=json.load(response)['jobs']
              pieces=[j for j in jobs if j['name'].startswith('render (')]
              if not pieces or any(j['status']!='completed' for j in pieces):ready=False
            if ready:break
            time.sleep(20)
          else:raise RuntimeError('Source rendering is still running')
          PYWAIT
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44051932446
          pattern: continuous-frames-*
          merge-multiple: true
          path: build/continuous-making/review
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44052780448
          pattern: continuous-frames-*
          merge-multiple: true
          path: build/continuous-making/review
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44051932446
          name: continuous-approved-finish
          path: public/assets/continuous-making-v1/approved/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44057835063
          pattern: continuous-mattes-*
          merge-multiple: true
          path: build/continuous-making/mattes
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44057835063
          pattern: continuous-empty-plates-*
          merge-multiple: true
          path: build/continuous-making/plates
      - run: python -m pip install pillow numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: continuous-grip-*
          merge-multiple: true
          path: build/continuous-making/grip-patches
      - run: python tools/continuous-making/apply_grip_patches.py
      - run: python tools/continuous-making/composite.py

      - name: Pack every source frame and preserve the approved finish
        run: python tools/continuous-making/pack.py --form --flat
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-making-form-packs
          path: public/assets/continuous-making-v1/form/
          compression-level: 0
          retention-days: 14
  review:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - name: Wait for the earlier media publication to settle
        env:
          MAKING_ACTION_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JSWAIT'
          for(let attempt=0;attempt<120;attempt++){
            const response=await fetch('https://api.github.com/repos/houseofstonebuild/house-of-stone/actions/runs/44057835063',{headers:{authorization:'Bearer '+process.env.MAKING_ACTION_TOKEN,accept:'application/vnd.github+json'}});if(!response.ok)throw Error('Cannot inspect source render review');const run=await response.json();if(run.status==='completed')process.exit(0);await new Promise(r=>setTimeout(r,20000));
          }
          throw Error('Earlier media review is still running');
          JSWAIT
      - uses: actions/checkout@v4
        with:
          ref: rebuild/continuous-making-2026-11-17
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: continuous-making-form-packs
          path: public/assets/continuous-making-v1/form/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44051932446
          name: continuous-approved-finish
          path: public/assets/continuous-making-v1/approved/
      - run: npm install --prefix qa --no-audit --no-fund
      - run: npm run check && npm test
      - name: Review continuous motion, stage completeness and responsive composition
        run: sh scripts/run-browser-qa.sh qa/continuous-making-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-making-full-review
          path: test-results/browser/continuous-making-full/
          retention-days: 14
      - name: Retain validated making media on the review branch
        if: success()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name houseofstonebuild
          git config user.email houseofstonebuild@users.noreply.github.com
          git add public/assets/continuous-making-v1/form public/assets/continuous-making-v1/approved
          git diff --cached --quiet && exit 0
          git commit -m 'Retain the reviewed continuous making sequence from unchanged Coil source'
          git fetch origin rebuild/continuous-making-2026-11-17
          git rebase origin/rebuild/continuous-making-2026-11-17
          git push origin HEAD:rebuild/continuous-making-2026-11-17
