name: Build source-resolution Making carving excerpt
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-making-cinema-frames-hd.sh'
      - '.github/workflows/making-atelier-hd.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: making-atelier-hd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg for original HD excerpt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render short lion-free footage and 48 HD scroll frames
        run: sh scripts/build-making-cinema-frames-hd.sh
      - name: Inspect exported media
        run: |
          test -s public/assets/making-chiseling-atelier-hd-v2.mp4
          test -s public/assets/making-cinema-frames-v2/frame_00.webp
          test -s public/assets/making-cinema-frames-v2/frame_47.webp
          test -s public/assets/making-cinema-frames-v2/manifest.json
      - name: Preserve original-frame visual review
        uses: actions/upload-artifact@v4
        with:
          name: making-atelier-hd-original-source
          path: |
            public/assets/making-cinema-frames-v2/manifest.json
            public/assets/making-cinema-frames-v2/frame_00.webp
            public/assets/making-cinema-frames-v2/frame_18.webp
            public/assets/making-cinema-frames-v2/frame_35.webp
            public/assets/making-cinema-frames-v2/frame_47.webp
          retention-days: 14
      - name: Publish high-resolution derived assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/making-chiseling-atelier-hd-v2.mp4 public/assets/making-cinema-frames-v2/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish high-resolution early carving excerpt for the Making'
          git pull --rebase origin main
          git push origin HEAD:main
