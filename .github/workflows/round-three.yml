name: Round three review
on:
  pull_request:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v6
        with:
          name: round-three-source-assets
          path: |
            AGENTS.md
            DEPLOYMENT.md
            package.json
            *.mjs
            public/*.js
            public/*.css
            public/*.json
            public/*.html
            content/
            test/
            qa/
            scripts/
            docs/
            public/assets/
            public/models/
          retention-days: 3

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --prefix qa --no-package-lock
      - run: node qa/round-three.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: round-three-browser
          path: test-results/round-three/
