name: Round three review
on:
  pull_request:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v6
        with:
          name: round-three-source-assets
          path: |
            public/assets/
            public/models/
          retention-days: 3
