name: Bake sculpture mobile frames
on:
  push:
    branches: [main]
    paths:
      - 'qa/build-mobile-sculpture-atlas.mjs'
      - 'qa/publish-mobile-sculpture-atlas.mjs'
      - '.github/workflows/sculpture-mobile-atlas.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sculpture-mobile-atlas
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --prefix qa --no-audit --no-fund
      - name: Bake 192 high-resolution Coil process frames (468x1013 each)
        run: node qa/build-mobile-sculpture-atlas.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mobile-sculpture-frame-manifest
          path: test-results/mobile-sculpture-atlas/manifest.json
          if-no-files-found: warn
      - name: Publish baked mobile frame sheets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/publish-mobile-sculpture-atlas.mjs
