name: Prepare native-detail story sheets
on:
  push:
    branches: ['refine/mabwe-film-2026-11-17']
    paths: ['tools/story-media/build_atlases.py', '.github/workflows/mabwe-story-media.yml']
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/mabwe-film-2026-11-17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - run: python tools/story-media/build_atlases.py
      - name: Commit generated browser assets to the review branch
        run: |
          git config user.name houseofstonebuild
          git config user.email 'houseofstonebuild@users.noreply.github.com'
          git add public/assets/story-sequence-v1
          git diff --cached --quiet && exit 0
          git commit -m 'Build native-detail story sheets from existing workshop and Coil frames'
          git push origin HEAD:refine/mabwe-film-2026-11-17
