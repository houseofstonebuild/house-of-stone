name: Finalize and review the continuous making study
on:
  push:
    branches: ['rebuild/continuous-making-2026-11-17']
    paths: ['.github/workflows/continuous-making-finalize.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: continuous-making-finalize-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for the original render pieces
        env:
          MAKING_ACTION_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWAIT'
          import os,time,json,urllib.request
          for attempt in range(120):
            ready=True
            for run_id in [44051932446,44052780448,44061093776]:
              request=urllib.request.Request(f'https://api.github.com/repos/houseofstonebuild/house-of-stone/actions/runs/{run_id}/jobs?per_page=100',headers={'Authorization':'Bearer '+os.environ['MAKING_ACTION_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:jobs=json.load(response)['jobs']
              pieces=[j for j in jobs if j['name'].startswith('render (')]
              if not pieces or any(j['status']!='completed' for j in pieces):ready=False
              elif run_id==44061093776 and any(j['conclusion']!='success' for j in pieces):raise RuntimeError('Grip render failed')
            if ready:break
            time.sleep(20)
          else:raise RuntimeError('Source rendering is still running')
          PYWAIT
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44051932446
          pattern: continuous-frames-*
          merge-multiple: true
          path: build/continuous-making/review
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44052780448
          pattern: continuous-frames-*
          merge-multiple: true
          path: build/continuous-making/review
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44051932446
          name: continuous-approved-finish
          path: public/assets/continuous-making-v1/approved/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44057835063
          pattern: continuous-mattes-*
          merge-multiple: true
          path: build/continuous-making/mattes
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44057835063
          pattern: continuous-empty-plates-*
          merge-multiple: true
          path: build/continuous-making/plates
      - run: python -m pip install pillow numpy
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44061093776
          pattern: continuous-grip-*
          merge-multiple: true
          path: build/continuous-making/grip-patches
      - run: python tools/continuous-making/apply_grip_patches.py
      - run: python tools/continuous-making/composite.py

      - name: Pack every source frame and preserve the approved finish
        run: python tools/continuous-making/pack.py --form --flat
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-making-form-packs
          path: public/assets/continuous-making-v1/form/
          compression-level: 0
          retention-days: 14
  review:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - name: Wait for the earlier media publication to settle
        env:
          MAKING_ACTION_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JSWAIT'
          for(let attempt=0;attempt<120;attempt++){
            const response=await fetch('https://api.github.com/repos/houseofstonebuild/house-of-stone/actions/runs/44061093776',{headers:{authorization:'Bearer '+process.env.MAKING_ACTION_TOKEN,accept:'application/vnd.github+json'}});if(!response.ok)throw Error('Cannot inspect source render review');const run=await response.json();if(run.status==='completed')process.exit(0);await new Promise(r=>setTimeout(r,20000));
          }
          throw Error('Earlier media review is still running');
          JSWAIT
      - uses: actions/checkout@v4
        with:
          ref: rebuild/continuous-making-2026-11-17
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: continuous-making-form-packs
          path: public/assets/continuous-making-v1/form/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44051932446
          name: continuous-approved-finish
          path: public/assets/continuous-making-v1/approved/
      - run: npm install --prefix qa --no-audit --no-fund
      - run: npm run check && npm test
      - name: Review continuous motion, stage completeness and responsive composition
        run: sh scripts/run-browser-qa.sh qa/continuous-making-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-making-full-review
          path: test-results/browser/continuous-making-full/
          retention-days: 14
      - name: Retain validated making media on the review branch
        if: success()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name houseofstonebuild
          git config user.email houseofstonebuild@users.noreply.github.com
          git add public/assets/continuous-making-v1/form public/assets/continuous-making-v1/approved
          git diff --cached --quiet && exit 0
          git commit -m 'Retain the reviewed continuous making sequence from unchanged Coil source'
          git fetch origin rebuild/continuous-making-2026-11-17
          git rebase origin/rebuild/continuous-making-2026-11-17
          git push origin HEAD:rebuild/continuous-making-2026-11-17
