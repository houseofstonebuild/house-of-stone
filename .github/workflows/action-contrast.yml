name: Action contrast and visual review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --prefix qa --no-audit --no-fund
      - run: node qa/action-contrast.mjs
        env:
          HOS_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: action-contrast-visual-review
          path: test-results/actions/
          retention-days: 7
